# FMCG Video Learning Engine: production-style deployment on one server.
#
#   caddy     -> the only public entry: https://DOMAIN (web app) and https://DOMAIN/api (API)
#   frontend  -> web app (nginx), reached through caddy
#   backend   -> backend API on 8000 + AI Model Service on 8001 (same container,
#                two processes), reached through caddy
#   mysql     -> MySQL 8 (data in the "mysql_data" volume), not public
#   backup    -> nightly database dump + copy of recordings into BACKUP_DIR
#
# Ollama (Qwen) keeps running on the host machine; the AI service reaches it at
# host.docker.internal:11434.
#
# First start:   copy .env.example to .env, fill it in, then
#                docker compose up -d --build
# Check:         docker compose ps        (all "healthy" / "running")
#                curl https://DOMAIN/api/health/ready

services:
  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (your domain name, or localhost for a local test)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env (certificate expiry notices go here)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates (keep this volume)
      - caddy_config:/config

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fmcg_learning}
      # Application account: full rights on this one database only (not root).
      MYSQL_USER: ${MYSQL_APP_USER:-fmcg_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      # Read-only account for backups (created by db-init/01_backup_user.sh on first start).
      MYSQL_BACKUP_USER: ${MYSQL_BACKUP_USER:-fmcg_backup}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD:?set MYSQL_BACKUP_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      # First start only: SQL dumps and setup scripts in db-init/ are imported/run.
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      # Only this computer can connect (for MySQL Workbench etc.); never the network.
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend-ai.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      # Backend -> MySQL (application account, not root)
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fmcg_learning}
      MYSQL_USER: ${MYSQL_APP_USER:-fmcg_app}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
      # Backend -> AI Model Service (same container, its own port). Required in production.
      AI_SERVICE_URL: http://127.0.0.1:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env (any long random string)}
      # AI Model Service -> Ollama on the host
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/generate}
      # Sign-in tokens survive container rebuilds
      FMCG_SECRET_KEY: ${FMCG_SECRET_KEY:?set FMCG_SECRET_KEY in .env}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: "8000"
      BACKEND_RELOAD: "false"
      # The browser reaches the API on the same site (https://DOMAIN/api)
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${DOMAIN}}
      # Client addresses come from Caddy (X-Forwarded-For); used by login throttling
      FMCG_TRUST_PROXY: "1"
      FMCG_MAX_UPLOAD_MB: ${FMCG_MAX_UPLOAD_MB:-500}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Same settings as before, all optional
      FMCG_WHISPER_MODEL: ${FMCG_WHISPER_MODEL:-small}
      FMCG_ANALYSIS_WORKERS: ${FMCG_ANALYSIS_WORKERS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Only this computer (for debugging); everyone else goes through https://DOMAIN/api
      - "127.0.0.1:8000:8000"
    volumes:
      - recordings:/srv/uploads                 # uploaded recordings (video_path in MySQL)
      - backend_work:/srv/backend/uploads       # analysis queue
      - ai_models:/srv/ai_service/models        # speaker / noise models (+ Linux deep-filter)
      - hf_cache:/root/.cache/huggingface       # Whisper + translation model downloads

  frontend:
    build:
      context: ./frontend
      args:
        # Backend address as the browser reaches it (fixed at build time): same site, /api
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://${DOMAIN}/api}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:80"

  backup:
    image: mysql:8.4
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fmcg_learning}
      MYSQL_BACKUP_USER: ${MYSQL_BACKUP_USER:-fmcg_backup}
      MYSQL_BACKUP_PASSWORD: ${MYSQL_BACKUP_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-20}
      BACKUP_RUN_NOW: ${BACKUP_RUN_NOW:-1}
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/restore.sh:/usr/local/bin/restore.sh:ro
      - recordings:/recordings:ro
      # Put this on another disk or a mounted cloud bucket (see docker/backup.sh).
      - ${BACKUP_DIR:-./backups}:/backups

volumes:
  mysql_data:
  recordings:
  backend_work:
  ai_models:
  hf_cache:
  caddy_data:
  caddy_config:
