# Continuous integration: every push and pull request must pass before merging.
#   backend   lint (ruff), tests (pytest on SQLite), dependency audit (pip-audit)
#   frontend  install from the lock file, lint, production build
#   mobile    flutter analyze (Android and iOS share the same Dart code)
#   compose   docker compose config validates the deployment file
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (errors only, see ruff.toml)
        run: ruff check . ../ai_service --config ../ruff.toml
      - name: Tests
        run: pytest -q
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements-backend.txt

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - name: Known vulnerabilities in AI service dependencies
        run: pip-audit -r ai_service/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.com/api
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml with the example settings
        run: cp .env.example .env && docker compose config --quiet
